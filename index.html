<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ferretería Bellabista · El Playón</title>
  <meta name="description" content="Ferretería Bellabista en El Playón, Santander. Consulta el inventario en línea.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">El Playón, Santander</p>
      <h1>Ferretería <span>Bellabista</span></h1>
      <p>Herramientas, tornillería, pinturas, plomería y electricidad.</p>
      <nav class="actions">
        <a class="btn" href="tel:+573154187423">📞 315 418 7423</a>
        <a class="btn ghost" href="https://wa.me/573154187423" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a class="btn ghost" href="https://www.google.com/maps/search/?api=1&amp;query=Google&amp;query_place_id=ChIJP93pTxPiZ44R-opUtD6OFhs" target="_blank" rel="noopener">📍 Cómo llegar</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar producto…" aria-label="Buscar producto">
      <select id="category" aria-label="Categoría"><option value="">Todas las categorías</option></select>
    </div>
    <p id="status" class="status">Cargando inventario…</p>
    <section id="catalog" class="grid"></section>

    <section class="map">
      <h2>Ubicación</h2>
      <iframe title="Mapa de Ferretería Bellabista" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=7.4718328,-73.2051426&amp;z=15&amp;output=embed"></iframe>
    </section>

    <section id="admin" class="panel" hidden>
      <div id="auth">
        <h2>Modo admin</h2>
        <form id="login" class="row">
          <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
          <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
          <button class="btn">Entrar</button>
        </form>
        <p id="login-msg" class="muted"></p>
      </div>

      <div id="tools" hidden>
        <div class="row">
          <h2>Administrar inventario</h2>
          <button id="seed" class="btn ghost small">Importar catálogo inicial</button>
          <button id="logout" class="btn ghost small">Salir</button>
        </div>
        <form id="new-product" class="form-grid">
          <input name="name" placeholder="Nombre del producto" required>
          <input name="category" list="categories" placeholder="Categoría">
          <input name="price" type="number" min="0" step="100" placeholder="Precio (COP)" required>
          <input name="stock" type="number" min="0" placeholder="Cantidad" required>
          <input name="photo" type="url" placeholder="URL de foto (opcional)">
          <button class="btn">Agregar</button>
        </form>
        <datalist id="categories"></datalist>
        <div id="admin-list"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>© Ferretería Bellabista · El Playón, Santander · 315 418 7423</p>
    <button id="admin-toggle" class="link">Modo admin</button>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
